name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo package version v$version."
          }

          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $env:CARGO_ENCODED_RUSTFLAGS = @(
            '-C', 'target-feature=+crt-static',
            '--remap-path-prefix', "$env:GITHUB_WORKSPACE=/workspace",
            '--remap-path-prefix', "$cargoHome=/cargo"
          ) -join [char]31
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $base = "OpenConneX-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory $base | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/openconnex.exe "$base/OpenConneX.exe"
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt $base
          Compress-Archive -Path "$base/*" -DestinationPath "$base.zip"
          $hash = (Get-FileHash "$base.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $base.zip" | Set-Content -Encoding ascii "$base.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "OpenConneX-$tag-windows-x64.zip"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive "$archive.sha256" --clobber
            exit $LASTEXITCODE
          }

          $flags = @('--verify-tag', '--title', "OpenConneX $tag")
          if ($tag -match '^v0\.' -or $tag.Contains('-')) { $flags += '--prerelease' }

          if ((git cat-file -t "refs/tags/$tag") -eq 'tag') {
            $notes = git for-each-ref --format='%(contents)' "refs/tags/$tag" | Out-String
            $notes.Trim() | Set-Content release-notes.md
            $flags += @('--notes-file', 'release-notes.md')
          } else {
            $flags += '--generate-notes'
          }
          gh release create $tag $archive "$archive.sha256" @flags
          exit $LASTEXITCODE
