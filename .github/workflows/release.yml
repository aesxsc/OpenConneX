name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev libwayland-dev libx11-dev libxkbcommon-dev

      - name: Build and package
        shell: pwsh
        run: |
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo package version v$version."
          }

          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $flags = @(
            '--remap-path-prefix', "$env:GITHUB_WORKSPACE=/workspace",
            '--remap-path-prefix', "$cargoHome=/cargo"
          )
          if ($IsWindows) { $flags += @('-C', 'target-feature=+crt-static') }
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]31
          cargo build --release --locked --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $platform = if ($IsWindows) { 'windows' } else { 'linux' }
          $base = "OpenConneX-$env:GITHUB_REF_NAME-$platform-x64"
          New-Item -ItemType Directory $base, release | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.txt $base
          $build = "target/$env:BUILD_TARGET/release"
          if ($IsWindows) {
            $archive = "$base.zip"
            Copy-Item "$build/openconnex.exe" "$base/OpenConneX.exe"
            Compress-Archive -Path "$base/*" -DestinationPath "release/$archive"
          } else {
            $archive = "$base.tar.gz"
            install -m 755 "$build/openconnex" "$base/openconnex"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar -czf "release/$archive" "$base"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $hash = (Get-FileHash "release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ascii "release/$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            exit
          fi

          flags=(--verify-tag --title "OpenConneX $tag")
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then flags+=(--prerelease); fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]]; then
            git for-each-ref --format='%(contents)' "refs/tags/$tag" > release-notes.md
            flags+=(--notes-file release-notes.md)
          else
            flags+=(--generate-notes)
          fi
          gh release create "$tag" "${flags[@]}" release/*
