[package]
name = "openconnex"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native Bluetooth controller for EDIFIER MR3 studio monitors"
license = "WTFPL"
repository = "https://github.com/aesxsc/OpenConneX"

[lib]
name = "openconnex_core"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "accesskit", "android-native-activity"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
eframe = { version = "0.34", default-features = false, features = ["wayland", "x11"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth", "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile", "Devices_Radios", "Devices_Enumeration",
    "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT", "Wdk_System_SystemServices", "Win32_System_SystemInformation"
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
